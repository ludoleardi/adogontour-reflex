version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    expose:
      - "8000"
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always